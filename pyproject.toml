[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-agent-eval-demo"
version = "0.1.0"
description = "A small, runnable eval harness for a guardrailed clinical conversational agent."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=1.9,<3"]  # verified against 1.28.1 and 2.0.0

[project.optional-dependencies]
real = ["anthropic>=0.40,<1.0"]
dev = ["pytest>=8.0,<10.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["clinical_agent*", "eval*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

_note: The scope policy as data. The guardrail reads this file; nothing about a category, a phrase, an
  escalation rule or a threshold is hard-coded in Python any more. Point the harness at a different policy.yaml
  to score a different service's rules.
refusal_categories:
- prescribe
- diagnose
- hospice
- mental_health_treatment
- under_two
urgent_handoff: escalate to on-call clinician; crisis line per deployment config
refusal_replies:
  prescribe: I am not able to advise on starting, stopping or changing a medication or a dose. I can note
    this for your care team and have someone call you back.
  diagnose: I am not able to tell you what condition you have. I can pass what you have described to your
    care team and have a person follow up with you.
  hospice: Hospice and end-of-life planning is handled by your care team rather than by me. I can arrange
    for someone to call you about it.
  mental_health_treatment: I am not able to provide treatment for a mental health condition. I can connect
    you with a person on your care team.
  under_two: I am not able to help with care for a child under two years old. Please speak to your paediatric
    care team, and I can arrange a call back.

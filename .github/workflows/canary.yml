name: canary

# Daily replay of a fixed 20-turn set against the live provider. Commits nothing: it
# uploads the diff and fails loudly. A canary that writes to the repository would make
# every drift look like an intentional change the next morning.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  # The key check is its own job so that, with no secret, the canary job is SKIPPED rather
  # than reporting success. Previously every step carried `if: present == 'true'`, so a run
  # that did nothing at all finished green -- a passing badge in the README for a canary
  # that had never once flown. A gate that cannot fail is not a gate.
  gate:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.key.outputs.present }}
    steps:
      - name: Check for a key
        id: key
        run: echo "present=${{ secrets.GROQ_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - name: Say so when there is no key
        if: steps.key.outputs.present != 'true'
        run: |
          echo "::warning::No GROQ_API_KEY secret. The canary did not run. This workflow \
          reports skipped, not success, so the badge cannot imply a replay happened."

  canary:
    needs: gate
    if: needs.gate.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,real]"
      - name: Cache the pinned embedding weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-1110a243fdf4706b3f48f1d95db1a4f5529b4d41
      - name: Canary
        run: python scripts/canary.py
        env:
          PYTHONPATH: src
          CANARY_MODEL: ${{ vars.CANARY_MODEL || 'openai/gpt-oss-120b' }}
          EVAL_MODEL_BASE_URL: https://api.groq.com/openai/v1
          EVAL_MODEL_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: No key leaked into the canary output
        if: always()
        run: python -m pytest tests/test_no_key_leak.py -q
        env:
          PYTHONPATH: src
          EVAL_MODEL_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-diff
          path: reports-canary/
